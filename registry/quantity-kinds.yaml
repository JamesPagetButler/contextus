# Contextus Quantity-Kind Registry
#
# Governance source (human-readable diffs, §I4 amendments land here).
# Spec Addendum NT-Signal-Measurement §5.
#
# Versioning invariant (§5.3): kinds are never deleted, only deprecated.
# The registry grows monotonically. Any pinned registry version remains
# permanently valid; old signals never become unevaluable.
#
# After editing this file, regenerate the JSON projection:
#   go run ./cmd/registry-gen ./registry/quantity-kinds.yaml > ./registry/quantity-kinds.json
#
# YAML governs; JSON feeds. Edda Stage 1 pins by version and verifies by
# content hash (Q3 ruling, seq=512; §5.6).
#
# Extension: add a new entry with the next introduced_in version. Never
# remove or change existing entries. Deprecation: set deprecated_in +
# maps_to on the retiring entry. Split governance rules in §7.

registry_version: 1

kinds:

  # --- QBP kinds ---

  - kind: SoundSpeedPeak
    owner_tenant: qbp
    unit_system: dimensionless
    description: >
      Peak sound speed in units of c (dimensionless). The motivating quantity
      from the seq=317 live-test failure: a scout reported 0.68 ± 0.14 c and a
      language model declared it "not near 2/3" — structurally impossible after
      this schema contract. Spec Addendum §1.
    introduced_in: 1

  - kind: GravitationalWaveStrain
    owner_tenant: qbp
    unit_system: dimensionless
    description: >
      Dimensionless gravitational-wave strain h = ΔL/L. Used by QBP scouts
      monitoring LIGO/LISA GW strain timeseries for anomalies correlated with
      Fermi GBM gamma-ray bursts (QBP-EXP-11 GW-GRB pipeline).
    introduced_in: 1

  # --- BMA telemetry kinds ---
  # Aligned with ctx-adapter-system §5 observation kinds (Spec Addendum §5.5).

  - kind: CPUTemperature
    owner_tenant: bma
    unit_system: si
    description: >
      CPU package temperature in Kelvin (SI). BMA autonomic subsystem reports
      this to Contextus via the NT_SCOPE_OPERATIONAL hardware.cpu scope.
      Used by BMA-AUTO-S thermal staging (Stage 1 threshold detection).
    introduced_in: 1

  - kind: MemoryPressure
    owner_tenant: bma
    unit_system: dimensionless
    description: >
      Memory pressure as a dimensionless fraction [0, 1]: ratio of allocated
      memory to total available memory in the BMA Crawl container (14 GB cap).
      Value 1.0 means fully saturated. Reported by BMA autonomic subsystem
      to the BMA telemetry scout.
    introduced_in: 1
