# BMA-prime operational-scope fixture per
# Contextus-Spec-Addendum-NT-Scope-Operational §6.1 worked example.
#
# Pattern: one host-level umbrella operational scope (hardware_class: "")
# nesting per-subsystem child scopes for cpu / disk / gpu / memory.
# Each scope is tier_immune: true — host identity is foundational.
#
# Exercises: round-trip; envelope-split (tier_immune + salience);
# hierarchical aggregation via parent_scope_id; v0.1 hardware-class
# taxonomy coverage; runtime.bma-instance Tags entry.

physical_scopes: []
conceptual_scopes: []

operational_scopes:
